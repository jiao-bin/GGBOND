    <text x='20' y='32' fill='#B45309' font-size='15' font-weight='bold'>【涌益咨询·生猪市场日评与深度行情跟踪】</text>
    <text x='20' y='64' fill='#78350F' font-size='13'>1. 现货节奏：今日全国外三元生猪均价11.07元/kg，较昨日微涨0.03元/kg。北方部分规模场挺价意愿增强。</text>
    <text x='20' y='94' fill='#78350F' font-size='13'>2. 标肥价差：全国标肥价差维持在+0.35元/kg温和溢价，大猪需求持续稳定，二育补栏呈现理性节奏。</text>
    <text x='20' y='124' fill='#78350F' font-size='13'>3. 出栏均重：本周全国重点样本出栏均重为124.20kg，较上期微增0.10kg，整体处于安全合理区间。</text>
    <text x='20' y='154' fill='#78350F' font-size='13'>4. 二次育肥：样本二育出栏占比约为4.10%，补栏以适重标猪为主，短期未形成集中抢猪潮。</text>
    <text x='20' y='184' fill='#78350F' font-size='13'>5. 屠宰开工率：重点监测屠企开工率26.50%，冻品库容率24.20%，白条终端消费稳健。</text>
